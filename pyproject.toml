[project]
name = "visionnetworkimplentations"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mbero-akoko", email = "mberoakoko@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "diffrax>=0.7.2",
    "equinox>=0.13.8",
    "grain>=0.2.18",
    "jax[cuda12]>=0.11.2",
    "loguru>=0.7.3",
    "matplotlib>=3.11.2",
    "numpyro>=0.22.0",
    "optax>=0.2.8",
    "pyarrow>=25.0.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "tqdm>=4.70.1",
]

[project.scripts]
visionnetworkimplentations = "visionnetworkimplentations:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
